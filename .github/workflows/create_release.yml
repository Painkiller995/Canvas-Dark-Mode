name: Create Release

on:
  workflow_dispatch:
  workflow_call:
jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          npm version patch --no-git-tag-version
          git commit -am "Bump to $(node -p "require('./package.json').version")"
          git push

      - name: Get version
        id: packageVersion
        run: echo "current-version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build Chrome Extension
        run: pnpm build

      - name: Create Release Chrome
        run: cd dist && zip -r ../extension-chrome-${{ steps.packageVersion.outputs.current-version }}.zip *

      - name: Build Firefox Extension
        run: pnpm build:firefox

      - name: Create Release Firefox
        run: cd dist && zip -r ../extension-firefox-${{ steps.packageVersion.outputs.current-version }}.zip *

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "extension-chrome-${{ steps.packageVersion.outputs.current-version }}.zip,extension-firefox-${{ steps.packageVersion.outputs.current-version }}.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.packageVersion.outputs.current-version }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          generateReleaseNotes: true
